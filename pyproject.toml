[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epicpydevicelib"
version = "0.1.3"
description = "epicpydevicelib holds the classes needed for writing and managing EPICpy devices (e.g., see https://github.com/travisseymour/EPICpy, https://github.com/travisseymour/EPICpyDevices)."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "Travis Seymour", email = "nogard@ucsc.edu" }]
license = { file = "LICENSE" }

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
]

dependencies = [
    "epiclibcpp>=0.1.0",
    "ulid2>=0.3.0",
    "python-dateutil>=2.8.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pingouin>=0.5.4",
    "pandas>=2.1",
    "polars>=1.0",
    "requests>=2.31",
    "fastparquet>=2024.2.0",
    "pyarrow>=15.0.0",
    "multimethod>=2.0",
    "pyee>=12",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/travisseymour/epicpydevicelib"
Issues = "https://github.com/travisseymour/epicpydevicelib/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint]
ignore = [
    "E402",
    "E731",
    "F811",
]